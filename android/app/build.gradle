plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wanggood88.fit'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wanggood88.fit'
        // Health Connect 客户端库要求 minSdk 26（Android 8.0）
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KSTORE') ?: '/nonexistent/keystore.p12')
            storePassword System.getenv('KPASS') ?: 'unset'
            keyAlias 'fitkey'
            keyPassword System.getenv('KPASS') ?: 'unset'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'

    // Health Connect：安卓「健康」数据读取
    implementation 'androidx.health.connect:connect-client:1.1.0'

    constraints {
        // kotlin-stdlib 1.8 merged jdk7/jdk8 classes; force the empty 1.8.22 stubs
        // to avoid "Duplicate class kotlin.collections.jdk8..." between transitives
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
