plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wanggood88.fit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wanggood88.fit'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KSTORE') ?: '/nonexistent/keystore.p12')
            storePassword System.getenv('KPASS') ?: 'unset'
            keyAlias 'fitkey'
            keyPassword System.getenv('KPASS') ?: 'unset'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.media:media:1.7.0'

    constraints {
        // kotlin-stdlib 1.8 merged jdk7/jdk8 classes; force the empty 1.8.22 stubs
        // to avoid "Duplicate class kotlin.collections.jdk8..." between transitives
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
